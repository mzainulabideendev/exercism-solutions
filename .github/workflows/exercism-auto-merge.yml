name: Auto Merge Exercism PRs

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge Exercism PR
    runs-on: ubuntu-latest

    # Only run for PRs targeting main and created by Exercism.
    if: >
      github.event.pull_request.base.ref == 'main' &&
      (
        github.event.pull_request.user.login == 'exercism' ||
        github.event.pull_request.user.login == 'exercism[bot]'
      )

    steps:
      - name: Check PR information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "PR: #${{ github.event.pull_request.number }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head branch: ${{ github.event.pull_request.head.ref }}"

      - name: Merge Exercism PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" \
            --merge \
            --delete-branch